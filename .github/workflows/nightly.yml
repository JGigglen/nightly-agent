name: nightly-agent

on:
  schedule:
    - cron: "0 9 * * *" # 1am Pacific
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run agent
        run: |
          python agent/run_nightly.py
